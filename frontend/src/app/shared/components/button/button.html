<button 
    [type]="type()" 
    [disabled]="disabled()" 
    [class]="buttonClasses()"
    class="inline-flex gap-1 items-center font-medium transition-colors active:scale-95 disabled:opacity-50 cursor-pointer disabled:pointer-events-none">
    @if(icon()){
        <i [className]="icon()"></i>
    }
    <ng-content></ng-content>
</button>
