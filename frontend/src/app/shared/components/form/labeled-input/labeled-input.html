<div class="w-full flex flex-col gap-1">
  <label class="text-sm font-medium text-app-text-muted ml-1">
    {{ label() }}
  </label>
  
  <input 
    [type]="attributes.type" 
    [min]="attributes.min"
    [step]="attributes.step"
    [name]="name()"
    [placeholder]="placeholder()"
    [value]="value"
    [disabled]="disabled"
    (input)="handleInput($event)"
    (blur)="onTouched()"
    [class.border-status-danger]="isInvalid"
    [class.border-app-border-dark]="!isInvalid"
    class="w-full px-3 py-2 border rounded-lg outline-none transition-all focus:ring-2 focus:ring-brand-primary focus:border-brand-primary" 
  />

  @if (isInvalid) {
    <p class="text-status-danger text-xs mt-1 ml-1 font-medium animate-in fade-in slide-in-from-top-1 duration-200 flex gap-1 items-center">
      <i class="fa fa-circle-exclamation"></i>
      <span class="">
        {{ errorMessage }}
      </span>
    </p>
  }
</div>
