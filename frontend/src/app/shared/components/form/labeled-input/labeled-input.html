<div class="w-full">
  <label class="block text-sm font-medium text-slate-600 mb-1">
    {{ label() }}
  </label>
  
  <input 
    [type]="type()" 
    [name]="name()"
    [placeholder]="placeholder()"
    [value]="value"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    [disabled]="disabled"
    [class.border-red-500]="isError"
    [class.border-slate-300]="!isError"
    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" 
  />

  @if (isError) {
    <p class="text-red-500 text-xs mt-1">{{ errorMessage }}</p>
  }
</div>
