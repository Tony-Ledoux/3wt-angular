<div class="relative w-full flex flex-col gap-1">
    <label class="text-sm font-medium text-app-text-muted ml-1">
        {{ label() }}
    </label>

    <div class="relative">
        <input type="text" [value]="searchterm()" (input)="searchterm.set($any($event.target).value)"
            (keydown)="onKeyDown($event)" placeholder="Typ om te zoeken..."
            class="w-full px-3 py-2 border border-app-border-dark rounded-lg outline-none transition-all focus:ring-2 focus:ring-brand-primary focus:border-brand-primary">

        @if(searchterm().length > 0){
        <div
            class="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl max-h-60 overflow-y-auto transition-all">
            <div class="flex flex-col py-1 text-start">

                @for(item of availableOptions(); track $index){
                <div class="px-3 py-2 cursor-pointer transition-colors duration-150 
                                   flex items-center gap-2 text-sm" [class.bg-brand-primary]="activeIndex() === $index"
                    [class.text-brand-primary-light]="activeIndex() === $index"
                    [class.text-app-text-dark]="activeIndex() !== $index"
                    [class.hover:bg-brand-primary]="activeIndex() !== $index"
                    [class.hover:text-brand-primary-light]="activeIndex() !== $index" (click)="onOptionClick(item)">

                    <i class="fa fa-magnifying-glass"></i>
                    {{ item[key()] }}
                </div>
                } @empty {
                <div class="px-3 py-4 text-sm text-gray-500 italic select-none flex items-center justify-center">
                    <i class="fa fa-question"></i>
                    <span>Geen opties gevonden</span>
                </div>
                }
            </div>
        </div>
        }
    </div>
</div>
