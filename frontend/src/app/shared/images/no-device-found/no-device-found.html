<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4B5;stop-opacity:1" />
    </linearGradient>
    <!-- Ocean gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:1" />
    </linearGradient>
    <!-- Sand gradient -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4D03F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6AC00;stop-opacity:1" />
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF700;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="350" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="650" cy="120" r="80" fill="url(#sunGlow)" />
  <circle cx="650" cy="120" r="40" fill="#FFF700" />
  
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="650" y1="40" x2="650" y2="20" />
    <line x1="710" y1="60" x2="730" y2="40" />
    <line x1="730" y1="120" x2="750" y2="120" />
    <line x1="710" y1="180" x2="730" y2="200" />
    <line x1="650" y1="200" x2="650" y2="220" />
    <line x1="590" y1="180" x2="570" y2="200" />
    <line x1="570" y1="120" x2="550" y2="120" />
    <line x1="590" y1="60" x2="570" y2="40" />
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <!-- Cloud 1 -->
    <ellipse cx="150" cy="80" rx="50" ry="25" />
    <ellipse cx="120" cy="90" rx="35" ry="20" />
    <ellipse cx="180" cy="88" rx="40" ry="18" />
    
    <!-- Cloud 2 -->
    <ellipse cx="450" cy="60" rx="45" ry="22" />
    <ellipse cx="420" cy="70" rx="30" ry="18" />
    <ellipse cx="480" cy="68" rx="35" ry="16" />
  </g>

  <!-- Ocean -->
  <rect x="0" y="250" width="800" height="100" fill="url(#oceanGrad)" />
  
  <!-- Ocean waves -->
  <path d="M0,260 Q40,250 80,260 T160,260 T240,260 T320,260 T400,260 T480,260 T560,260 T640,260 T720,260 T800,260 L800,280 Q760,270 720,280 T640,280 T560,280 T480,280 T400,280 T320,280 T240,280 T160,280 T80,280 T0,280 Z" fill="#48C9B5" opacity="0.7"/>
  <path d="M0,270 Q40,265 80,270 T160,270 T240,270 T320,270 T400,270 T480,270 T560,270 T640,270 T720,270 T800,270 L800,290 Q760,285 720,290 T640,290 T560,290 T480,290 T400,290 T320,290 T240,290 T160,290 T80,290 T0,290 Z" fill="#2ECC71" opacity="0.5"/>
  
  <!-- Seagulls -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M300,150 Q310,140 320,150 Q310,145 300,150" />
    <path d="M310,148 Q320,138 330,148" />
    
    <path d="M200,130 Q207,123 215,130 Q207,127 200,130" />
    <path d="M207,128 Q215,121 223,128" />
    
    <path d="M500,170 Q507,163 515,170 Q507,167 500,170" />
    <path d="M507,168 Q515,161 523,168" />
  </g>

  <!-- Sand -->
  <rect x="0" y="340" width="800" height="260" fill="url(#sandGrad)" />
  
  <!-- Beach texture (small dots) -->
  <g fill="#D4A017" opacity="0.3">
    <circle cx="50" cy="400" r="2" />
    <circle cx="100" cy="450" r="1.5" />
    <circle cx="150" cy="380" r="2" />
    <circle cx="650" cy="420" r="1.5" />
    <circle cx="700" cy="460" r="2" />
    <circle cx="750" cy="390" r="1.5" />
    <circle cx="400" cy="480" r="2" />
    <circle cx="350" cy="430" r="1.5" />
  </g>

  <!-- Palm tree -->
  <g>
    <!-- Trunk -->
    <path d="M680,350 Q690,280 700,200 Q705,180 710,160" stroke="#8B4513" stroke-width="12" fill="none" stroke-linecap="round" />
    <!-- Palm leaves -->
    <path d="M710,160 Q650,100 600,120" stroke="#228B22" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M710,160 Q680,80 650,60" stroke="#32CD32" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M710,160 Q730,80 760,50" stroke="#228B22" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M710,160 Q770,100 790,130" stroke="#32CD32" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M710,160 Q760,140 780,180" stroke="#228B22" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M710,160 Q720,200 730,230" stroke="#32CD32" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Coconuts -->
    <circle cx="700" cy="168" r="8" fill="#8B4513" />
    <circle cx="718" cy="172" r="7" fill="#A0522D" />
  </g>

  <!-- ====== REFRIGERATOR ====== -->
  <g transform="translate(320, 250)">
    <!-- Shadow -->
    <ellipse cx="80" cy="145" rx="75" ry="8" fill="#C69B0A" opacity="0.5"/>
    
    <!-- Main body -->
    <rect x="20" y="10" width="120" height="130" rx="8" ry="8" fill="white" stroke="#E0E0E0" stroke-width="2"/>
    
    <!-- Top section (freezer) -->
    <rect x="25" y="15" width="110" height="45" rx="4" ry="4" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    
    <!-- Freezer handle -->
    <rect x="115" y="25" width="8" height="25" rx="3" fill="#ADB5BD"/>
    
    <!-- Bottom section (fridge) -->
    <rect x="25" y="65" width="110" height="65" rx="4" ry="4" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    
    <!-- Fridge handle -->
    <rect x="115" y="75" width="8" height="35" rx="3" fill="#ADB5BD"/>
    
    <!-- Ice dispenser -->
    <rect x="95" y="20" width="20" height="15" rx="3" fill="#E9ECEF" stroke="#CED4DA" stroke-width="0.5"/>
    <circle cx="105" cy="27" r="4" fill="#6C757D"/>
    
    <!-- Water/ice from dispenser -->
    <g>
      <rect x="103" y="35" width="4" height="8" rx="1" fill="#87CEEB" opacity="0.6"/>
      <circle cx="105" cy="46" r="2" fill="#87CEEB" opacity="0.5"/>
    </g>

    <!-- Fridge door details - magnets and papers -->
    <!-- Magnet 1: Beach theme starfish -->
    <polygon points="35,90 37,85 40,87 43,83 44,88 49,89 45,92 46,97 41,95 38,100 35,96 30,98" fill="#FF6B6B"/>
    
    <!-- Magnet 2: Postcard -->
    <rect x="30" y="40" width="25" height="18" rx="1" fill="#FFEAA7" stroke="#DFE6E9" stroke-width="0.5" transform="rotate(-5, 42, 49)"/>
    <text x="35" y="52" font-size="6" fill="#2D3436" transform="rotate(-5, 42, 49)" font-family="Arial">🌴</text>
    
    <!-- Magnet 3: Ice cream cone magnet -->
    <path d="M70,80 L75,95 L65,95 Z" fill="#F5CBA7"/>
    <circle cx="70" cy="77" r="4" fill="#FFB8B8"/>
    
    <!-- Fridge light glow -->
    <rect x="25" y="65" width="110" height="65" rx="4" ry="4" fill="none" stroke="#74B9FF" stroke-width="0.3" opacity="0.3"/>

    <!-- Vacation tag on fridge -->
    <g transform="translate(60, -5)">
      <rect x="0" y="0" width="40" height="20" rx="3" fill="#FFEAA7" stroke="#FDCB6E" stroke-width="1"/>
      <circle cx="-3" cy="10" r="3" fill="none" stroke="#E17055" stroke-width="1.5"/>
      <text x="8" y="14" font-size="8" fill="#2D3436" font-family="Arial, sans-serif" font-weight="bold">VACATION!</text>
    </g>

    <!-- Ice cubes on top of fridge -->
    <rect x="50" y="0" width="15" height="15" rx="2" fill="#B8E6F0" opacity="0.8"/>
    <rect x="68" y="-3" width="12" height="12" rx="2" fill="#B8E6F0" opacity="0.7"/>
    <rect x="45" y="-2" width="10" height="10" rx="2" fill="#D1F2EB" opacity="0.8"/>
  </g>

  <!-- Beach items around fridge -->
  <!-- Beach towel -->
  <g transform="translate(130, 420)">
    <rect x="0" y="0" width="100" height="60" rx="3" fill="#E74C3C"/>
    <rect x="0" y="0" width="100" height="15" rx="3" fill="#C0392B"/>
    <line x1="0" y1="20" x2="100" y2="20" stroke="#F39C12" stroke-width="3"/>
    <line x1="0" y1="45" x2="100" y2="45" stroke="#F39C12" stroke-width="3"/>
  </g>

  <!-- Beach ball -->
  <circle cx="600" cy="430" r="25" fill="#E74C3C"/>
  <path d="M575,430 Q600,410 625,430" fill="#F39C12" opacity="0.8"/>
  <path d="M575,430 Q600,450 625,430" fill="#3498DB" opacity="0.8"/>
  <path d="M600,405 L600,455" stroke="#ECF0F1" stroke-width="2"/>

  <!-- Flip-flops -->
  <g transform="translate(200, 470)">
    <ellipse cx="20" cy="10" rx="18" ry="8" fill="#3498DB"/>
    <path d="M10,10 Q20,0 30,10" stroke="#E74C3C" stroke-width="2" fill="none"/>
    
    <ellipse cx="70" cy="10" rx="18" ry="8" fill="#3498DB"/>
    <path d="M60,10 Q70,0 80,10" stroke="#E74C3C" stroke-width="2" fill="none"/>
  </g>

  <!-- Sunglasses on sand -->
  <g transform="translate(450, 480)">
    <rect x="0" y="0" width="25" height="18" rx="9" fill="#2C3E50"/>
    <rect x="30" y="0" width="25" height="18" rx="9" fill="#2C3E50"/>
    <line x1="25" y1="9" x2="30" y2="9" stroke="#2C3E50" stroke-width="2"/>
    <line x1="-5" y1="7" x2="0" y2="7" stroke="#2C3E50" stroke-width="2"/>
    <line x1="55" y1="7" x2="60" y2="7" stroke="#2C3E50" stroke-width="2"/>
  </g>

  <!-- Bucket and spade -->
  <g transform="translate(500, 440)">
    <!-- Bucket -->
    <path d="M10,0 L30,0 L35,30 L5,30 Z" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
    <path d="M8,-2 Q20,-8 32,-2" stroke="#D4AC0D" stroke-width="2" fill="none"/>
    
    <!-- Spade -->
    <line x1="50" y1="-20" x2="50" y2="10" stroke="#7F8C8D" stroke-width="3"/>
    <path d="M42,10 L58,10 L55,-5 Q50,-10 45,-5 Z" fill="#BDC3C7" stroke="#95A5A6" stroke-width="1"/>
  </g>

  <!-- Footprints in sand -->
  <g fill="#C69B0A" opacity="0.4">
    <ellipse cx="280" cy="440" rx="4" ry="7" transform="rotate(-15, 280, 440)"/>
    <ellipse cx="300" cy="455" rx="4" ry="7" transform="rotate(10, 300, 455)"/>
    <ellipse cx="315" cy="472" rx="4" ry="7" transform="rotate(-10, 315, 472)"/>
    <ellipse cx="340" cy="485" rx="4" ry="7" transform="rotate(15, 340, 485)"/>
  </g>

  <!-- Vacation text -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#E74C3C" text-anchor="middle">☀️ IJSKAST OP VAKANTIE! 🏖️</text>
  
  <!-- Decorative waves on sand -->
  <path d="M0,370 Q100,365 200,375 T400,370 T600,375 T800,370" stroke="#F4D03F" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
