<div class="fixed top-5 right-5 z-50 flex flex-col gap-3 w-full max-w-sm">
    @for(toast of toastService.toasts(); track toast.id){
    <div [class]="getTypeClasses(toast.type)" [class.opacity-0]="toast.isLeaving"
        [class.translate-x-full]="toast.isLeaving"
        class="relative overflow-hidden rounded-lg shadow-lg pointer-events-auto flex items-start p-4 transition-all duration-300 animate-slide-in">

        <!-- Icon Section -->
        <div class="shrink-0 mr-3 mt-0.5">
            @if(toast.icon) {
            <i [class]="toast.icon" class="text-xl"></i>
            } @else {
            <!-- Default icons based on type -->
            <i [class]="getDefaultIcon(toast.type)" class="text-xl"></i>
            }
        </div>

        <!-- Content Section -->
        <div class="flex-1 pt-0.5">
            <div class="text-sm font-medium text-gray-900 leading-tight" [innerHTML]="toast.message" ></div>
    
        </div>

        <!-- Close Button -->
        @if(toast.dismissable) {
        <button (click)="toastService.remove(toast.id)"
            class="ml-4 text-gray-500 hover:text-gray-700 transition-colors">
            <span class="text-lg leading-none">&times;</span>
        </button>
        }

        <!-- Progress Bar -->
        <div class="absolute bottom-0 left-0 h-1 bg-black/10 w-full">
            <div class="h-full animate-progress" [class]="getProgressBarColor(toast.type)"
                [style.animation-duration.ms]="toast.duration || 3000">
            </div>
        </div>
    </div>
    }
</div>
