<header class="bg-app-card border-b border-app-border px-4 py-3">
  <div class="container mx-auto flex items-center justify-between">
    
    <!-- App Logo/Naam -->
    <div class="flex items-center gap-2">
      <!-- Logo box: nu brand-primary i.p.v. blue-600 -->
      <div class="w-8 h-8 bg-brand-primary rounded-lg flex items-center justify-center text-white font-bold shadow-sm">
        H
      </div>
      <!-- Tekst: nu app-text-main en brand-primary -->
      <span class="text-xl font-bold text-app-text-main tracking-tight">
        Household<span class="text-brand-primary">App</span>
      </span>
    </div>

    <!-- Navigatie Buttons -->
    <nav class="flex items-center gap-4">
        @if(!userService.isAuth()){
            <!-- De ghost en primary varianten van app-button 
                 maken nu intern gebruik van de theme kleuren -->
            <app-button variant="ghost" (click)="userService.register()">Registreren</app-button>
            <app-button (click)="userService.login()">Aanmelden</app-button>
        } @else {
            <app-button variant="danger" (click)="handleLogOffClick()">Afmelden</app-button>
        }
    </nav>

  </div>
</header>
