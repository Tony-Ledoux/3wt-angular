<header class="bg-white border-b border-slate-200 px-4 py-3">
      <div class="container mx-auto flex items-center justify-between">
        
        <!-- App Logo/Naam -->
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">
            H
          </div>
          <span class="text-xl font-bold text-slate-800 tracking-tight">
            Household<span class="text-blue-600">App</span>
          </span>
        </div>

        <!-- Navigatie Buttons -->
        <nav class="flex items-center gap-4">
            @if(!userService.isAuth()){
                <app-button variant="ghost" (click)="userService.register()">Registreren</app-button>
                <app-button (click)="userService.login()">Aanmelden</app-button>

            } @else {
                <app-button variant="danger" (click)="handleLogOffClick()">Afmelden</app-button>
            }
        
        </nav>

      </div>
    </header>
