<aside class="w-64 bg-slate-800 text-white flex flex-col h-full transition-all duration-300 ease-in-out">
  <!-- Navigation Section -->
  <nav class="p-4 space-y-2 flex-1">
    <app-sidemenu-link label="Dashboard" link="/dashboard" icon="fa fa-chart-pie" />
    <app-sidemenu-link label="Profiel" link="/profile" icon="fa fa-user" />
    @if(householdService.selected_household()?.isowner){
      <app-sidemenu-link label="Instellingen" link="/settings" icon="fa fa-gear" />
    }
  </nav>

  <!-- User/Action Section -->
  <div class="p-4 border-t border-slate-700">
    <app-button variant="danger" (click)="handleLogOffClick()" [fullWidth]="true" class="flex items-center justify-center gap-2">
      <i class="fa-solid fa-right-from-bracket"></i> Afmelden
    </app-button>
  </div>
</aside>
