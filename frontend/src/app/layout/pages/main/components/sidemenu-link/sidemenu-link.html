<a [routerLink]="link()" 
   routerLinkActive="bg-brand-primary text-white"
   class="flex items-center p-2 hover:bg-brand-primary rounded transition-colors text-white/70 hover:text-white">
    @if(icon()){
        <i class="{{icon()}} w-6"></i> 
    }
    <span [class.ps-2]="icon()">{{label()}}</span>
</a>
