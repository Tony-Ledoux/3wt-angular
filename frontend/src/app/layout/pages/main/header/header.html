<!-- Aangepast: bg-white -> bg-app-card | border-gray-200 -> border-app-border -->
<header class="h-16 bg-app-card shadow-sm flex items-center justify-between px-4 border-b border-app-border">
    
    <!-- Linker Groep: Menu + Branding -->
    <div class="flex items-center gap-4">
        <!-- Aangepast: hover:bg-gray-100 -> hover:bg-brand-primary-light | text-gray-600 -> text-app-text-body -->
        <button (click)="onToggleSidebar.emit()"
            class="p-2 hover:bg-brand-primary-light rounded-lg text-app-text-body transition-colors" 
            title="Menu inklappen/uitklappen">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Branding Section -->
        <div class="flex items-center gap-3">
            <!-- Aangepast: bg-emerald-500 -> bg-brand-primary | shadow-emerald-500/20 -> shadow-brand-primary/20 -->
            <div class="w-8 h-8 bg-brand-primary rounded-lg flex items-center justify-center shadow-lg shadow-brand-primary/20">
                <i class="fa-solid fa-utensils text-white"></i>
            </div>
            <!-- Aangepast: text-slate-800 -> text-app-text-main -->
            <span class="text-xl font-bold tracking-tight text-app-text-main">MyKitchen</span>
        </div>
    </div>

    <!-- Rechter Groep: User Profile -->
    <div class="flex items-center gap-4">
        <div class="flex flex-col items-end">
            <!-- Aangepast: text-gray-700 -> text-app-text-main -->
            <span class="text-sm font-medium text-app-text-main">{{ user.user()?.name }}</span>
            <!-- Aangepast: text-gray-500 -> text-app-text-muted -->
            <span class="text-xs text-app-text-muted">{{ household_service.selected_household()?.householdName }}</span>
        </div>
        <!-- Aangepast: bg-gray-200 -> bg-app-border | text-gray-600 -> text-app-text-body -->
        <div class="w-8 h-8 bg-app-border rounded-full flex items-center justify-center text-app-text-body font-bold text-xs">
            {{ user.user()?.name?.charAt(0) || 'U' }}
        </div>
    </div>
</header>
