<a [routerLink]="link()"
    routerLinkActive="bg-blue-600 text-white"
    class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors hover:bg-slate-800 group">
    @if(icon()){
        <i [class]="'fas ' + icon() + ' w-5 text-center group-hover:text-blue-400'"></i>
    }
    <span>{{ label() }}</span>
</a>
