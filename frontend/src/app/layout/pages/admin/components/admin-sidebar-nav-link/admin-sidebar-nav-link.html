<a [routerLink]="link()"
    routerLinkActive="bg-brand-accent text-white"
    class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 hover:bg-slate-800 group">
    
    @if(icon()){
        <i [class]="'fas ' + icon() + ' w-5 text-center transition-colors group-hover:text-brand-accent'"></i>
    }
    
    <span class="font-medium">{{ label() }}</span>
</a>
