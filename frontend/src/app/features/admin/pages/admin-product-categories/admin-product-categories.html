<div class="max-w-4xl mx-auto p-6 bg-gray-50 min-h-screen">
  <div class="bg-white shadow-xl rounded-2xl p-8 border border-gray-100">
    <h2 class="text-3xl font-extrabold text-gray-800 mb-8 pb-2 border-b-4 border-indigo-500 w-fit">
      Product Categorie Beheren
    </h2>

    <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()" class="space-y-6">
      <!-- Categorie Naam -->
      <app-labeled-input label="Categorie Naam" name="categoryName" formControlName="CategorieName" />

      <div class="relative py-4">
        <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-200"></span></div>
        <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-500">Storage Rules</span></div>
      </div>

      <!-- Storage Rules Sectie -->
      <div formArrayName="storageRules" class="space-y-4">
        @for (rule of storageRules.controls; track rule; let i = $index) {
          <div [formGroupName]="i" class="p-5 bg-gray-50 border border-gray-200 rounded-xl relative group hover:border-indigo-300 transition-colors">
            <div class="flex justify-between items-center mb-4">
              <h4 class="text-sm font-bold text-indigo-600 uppercase tracking-wider">
                Regel #{{ i + 1 }}
              </h4>
              <button 
                type="button" 
                (click)="removeStorageRule(i)" 
                class="text-xs text-red-500 hover:text-red-700 font-semibold transition-colors flex items-center gap-1"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4h4m-4 4h4m-5 4h10a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                Verwijder
              </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <app-labeled-selectbox formControlName="deviceType" label="Device Type" [choices]="deviceTypes()" />
                <app-labeled-input type="number" formControlName="multiplier" label="multiplier" name="multiplier"  />
            </div>
          </div>
        } @empty {
          <div class="text-center py-8 border-2 border-dashed border-gray-300 rounded-xl">
            <p class="text-gray-500 text-sm">Er zijn nog geen storage rules toegevoegd.</p>
          </div>
        }
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col gap-4 mt-6">
        <button 
          type="button" 
          (click)="addStorageRule()" 
          class="w-full py-2 px-4 bg-white border-2 border-indigo-600 text-indigo-600 rounded-lg font-semibold hover:bg-indigo-50 transition-colors flex items-center justify-center gap-2"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
          </svg>
          Voeg Storage Rule toe
        </button>

        <button 
          type="submit" 
          [disabled]="categoryForm.invalid" 
          class="w-full py-3 px-4 bg-indigo-600 text-white rounded-lg font-bold shadow-lg hover:bg-indigo-700 disabled:bg-gray-400 disabled:shadow-none transition-all transform active:scale-[0.98]"
        >
          Opslaan Categorie
        </button>
      </div>
    </form>
  </div>

  <!-- Debug Section -->
  <div class="mt-12">
    <h3 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
      <span class="w-2 h-6 bg-indigo-500 rounded-full"></span>
      Huidige Categorieën (Debug)
    </h3>
    <pre class="bg-gray-900 text-green-400 p-4 rounded-xl overflow-auto text-xs font-mono shadow-inner border border-gray-800">
{{ categories() | json }}
    </pre>
  </div>
</div>
