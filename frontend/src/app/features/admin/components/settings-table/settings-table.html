<div class="w-full max-w-6xl mx-auto p-4">
  <div class="overflow-hidden rounded-xl border border-slate-200 shadow-sm bg-white">
    <table class="w-full border-collapse text-left">
      <thead class="bg-slate-50 border-b border-slate-200">
        <tr>
          <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-600">Instelling</th>
          <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-600">Waarde</th>
          <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-600">Beschrijving</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (setting of settings(); track setting.key) {
          @let error = this.validateSetting(setting); 
          
          <tr class="hover:bg-slate-50/50 transition-colors group">
            <td class="px-6 py-4 text-sm font-medium text-slate-900 w-1/4">
              {{ setting.key }}
            </td>
            
            <td class="px-6 py-4 w-1/3">
              <div class="flex flex-col gap-1">
                <input 
                  type="text" 
                  [(ngModel)]="setting.value" 
                  (ngModelChange)="onValueChange()" 
                  [class]="'w-full px-3 py-2 text-sm border rounded-md bg-white text-slate-700 shadow-sm transition-all focus:outline-none focus:ring-2 ' + 
                           (error ? 'border-red-500 focus:ring-red-500/20 focus:border-red-500' : 'border-slate-300 focus:ring-blue-500/20 focus:border-blue-500')"
                />
                
                @if (error) {
                  <span class="text-red-500 text-[10px] font-medium leading-none">
                    {{ error }}
                  </span>
                }
              </div>
            </td>
            
            <td class="px-6 py-4 text-sm text-slate-500 italic leading-relaxed">
              {{ setting.description }}
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="px-6 py-12 text-center text-slate-400 text-sm italic">
              Geen instellingen beschikbaar.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="mt-6 flex justify-end">
    <button 
      (click)="onSave()" 
      [disabled]="!isFormValid()"
      [class]="'inline-flex items-center px-5 py-2.5 text-sm font-semibold rounded-lg shadow-sm transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-offset-2 ' + 
                (isFormValid() ? 'bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500' : 'bg-slate-300 text-slate-500 cursor-not-allowed')"
    >
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      Wijzigingen Opslaan
    </button>
  </div>
</div>
