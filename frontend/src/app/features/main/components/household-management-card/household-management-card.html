<div (click)="onCardClick()"
    [class]="'relative p-4 cursor-pointer rounded-xl border-2 transition-all duration-200 ' + 
              (isSelected() ? 'border-blue-500 bg-blue-50/30 ring-1 ring-blue-500' : 'border-slate-200 bg-white hover:border-slate-300 hover:shadow-sm')">
    <!-- Status Badge (Owner vs Member) -->
    <div class="flex justify-between items-start mb-3">
        <span [class]="'text-xs font-bold px-2 py-1 rounded uppercase ' + 
                      (household().isowner ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-600')">
            {{ household().isowner ? 'Eigenaar' : 'Lid' }}
        </span>

        @if(isSelected()){
        <div class="text-blue-600">
            <i class="fa fa-circle-check text-lg"></i>
        </div>
        }
    </div>

    <!-- Naam van het huishouden -->
    <h3 class="text-lg font-semibold text-slate-800 truncate mb-4">
        {{ household().householdName }}
    </h3>

    <!-- Actie sectie -->
    <div class="flex items-center justify-between mt-auto pt-3 border-t border-slate-100">
        @if(!isSelected()){
        @if(!household().isowner) {
        <button (click)="onLeaveClick($event)"
            class="text-red-500 hover:text-red-700 text-sm font-medium flex items-center gap-1.5 transition-colors p-1 -m-1 rounded hover:bg-red-50">
            <i class="fa fa-right-from-bracket"></i> Verlaat
        </button>
        } @else {
        <button (click)="onRemoveClick($event)"
            class="text-red-500 hover:text-red-700 text-sm font-medium flex items-center gap-1.5 transition-colors p-1 -m-1 rounded hover:bg-red-50">
            <i class="fa fa-trash-can"></i> Verwijder
        </button>
        <span class="text-slate-400 text-xs font-medium">Klik om te selecteren</span>
        }
        }@else { 
            <span class="text-slate-400 text-xs font-medium">Geen acties toegelaten</span>
        }

    </div>
</div>
