<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" role="img" aria-label="Informatie: Binnenkort beschikbaar in een volgende versie">
  <defs>
    <!-- Subtiele schaduw voor de kaart -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Achtergrondkaart -->
  <rect x="1" y="1" width="398" height="158" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Icoon: Klok (Symboliseert "Volgende versie") -->
  <g transform="translate(40, 55)">
    <circle cx="26" cy="26" r="24" fill="#f3f4f6" stroke="#4f46e5" stroke-width="2"/>
    <!-- Wijzers -->
    <line x1="26" y1="26" x2="26" y2="12" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="26" x2="36" y2="32" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Punten -->
    <circle cx="26" cy="8" r="1" fill="#4f46e5"/>
    <circle cx="44" cy="26" r="1" fill="#4f46e5"/>
    <circle cx="26" cy="44" r="1" fill="#4f46e5"/>
    <circle cx="8" cy="26" r="1" fill="#4f46e5"/>
  </g>

  <!-- Hoofdtekst -->
  <text x="100" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1f2937">
    Binnenkort beschikbaar
  </text>

  <!-- Ondertekst -->
  <text x="100" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">
    Deze pagina is momenteel nog niet beschikbaar.
  </text>

  <text x="100" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">
    Het wordt opgenomen in een volgende versie.
  </text>

  <!-- Decoratie: Linker rand accent -->
  <rect x="0" y="20" width="6" height="120" rx="3" fill="#4f46e5"/>
</svg>
