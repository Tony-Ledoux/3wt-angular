
    <app-page-header 
        title="Mijn Huishoudens"
        [subtitle]="subtitleText()"
         />
    <app-section-card title="Kies een huishouden">

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            @for (house of householdSrv.households(); track house.householdId) {
                <app-household-management-card 
                [household]="house" 
                [isSelected]="isHouseholdSelected(house.householdId)"
                (select)="onSelectHousehold($event)" 
                (leave)="onLeaveHousehold($event)"
                (remove)="onRemoveHouseHold($event)"
                />
            }
        </div>
    </app-section-card>

    <!-- Sectie voor nieuwe huishoudens -->
    @if(householdSrv.houshold_slots_left() > 0){
        <app-section-card title="Toevoegen">
            <div class="max-w-xl mx-auto">
            <app-section-card type="dashed" title="slots">
                    <app-pill-component card-header-action  type="pill" variant="slate" label="resterend" [value]="householdSrv.houshold_slots_left()" />
                    <div class="flex flex-col gap-2">

                        @if(householdSrv.canCreateHousehold()){
                            <app-button size="lg" [fullWidth]="true" (click)="householdSrv.handleCreateNewHousehold()" icon="fa fa-plus">
                                <span>Nieuw huishouden maken</span>
                            </app-button>
                        }
                        @if(householdSrv.canJoinHouseholds()){
                            <app-button size="lg" [fullWidth]="true" variant="secondary" (click)="householdSrv.handleJoinNewHousehold()" icon="fa fa-location-dot">
                                <span class="flex items-center gap-2">voeg Huishouden toe</span>
                            </app-button>
                        }
                    </div>
                    
                </app-section-card>
            </div>
        </app-section-card>
    }
